name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    name: skills and benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      - name: Validate benchmark is well-formed
        run: |
          node -e "
            const b = require('./data/benchmark.json');
            if (!b.sample || !Array.isArray(b.findings)) throw new Error('benchmark.json is missing sample or findings');
            if (b.findings.length === 0) throw new Error('benchmark.json has no findings');
            for (const f of b.findings) {
              if (!f.code || !f.severity) throw new Error('finding without code or severity: ' + JSON.stringify(f));
              if (typeof f.prevalence !== 'number' || f.prevalence < 0 || f.prevalence > 100) {
                throw new Error('implausible prevalence for ' + f.code + ': ' + f.prevalence);
              }
              // The headline severity must be one the data actually contains, and the
              // breakdown must account for every affected store. Without this, a code
              // could advertise CRITICAL while no store was ever rated critical for it.
              const split = f.severity_breakdown;
              if (!split || typeof split !== 'object') {
                throw new Error('finding without severity_breakdown: ' + f.code);
              }
              const total = Object.values(split).reduce((a, n) => a + n, 0);
              if (total !== f.stores) {
                throw new Error('severity_breakdown for ' + f.code + ' sums to ' + total + ' but ' + f.stores + ' stores are affected');
              }
              if (!(f.severity in split)) {
                throw new Error('finding ' + f.code + ' is labelled ' + f.severity + ' but no store was rated that: ' + JSON.stringify(split));
              }
              const top = Math.max(...Object.values(split));
              if (split[f.severity] !== top) {
                throw new Error('finding ' + f.code + ' is labelled ' + f.severity + ' (' + split[f.severity] + ' stores) but that is not the dominant severity: ' + JSON.stringify(split));
              }
            }
            console.log(b.findings.length + ' findings over ' + b.sample.stores + ' stores: ok');
          "

      - name: Check per-skill benchmark copies have not drifted
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const root = fs.readFileSync('data/benchmark.json', 'utf8');
            const skills = fs.existsSync('skills') ? fs.readdirSync('skills') : [];
            let checked = 0;
            for (const skill of skills) {
              const copy = path.join('skills', skill, 'assets', 'benchmark.json');
              if (!fs.existsSync(copy)) continue;
              if (fs.readFileSync(copy, 'utf8') !== root) {
                throw new Error(copy + ' has drifted from data/benchmark.json: run scripts/build-benchmark.mjs');
              }
              checked++;
            }
            console.log(checked + ' skill benchmark copy(ies) in sync');
          "

      - name: Check README sample figures match the benchmark
        run: |
          node -e "
            const fs = require('fs');
            const b = require('./data/benchmark.json');
            const readme = fs.readFileSync('README.md', 'utf8');
            const expected = [
              b.sample.stores.toLocaleString('en-US'),
              b.sample.product_pages.toLocaleString('en-US'),
              b.sample.share_with_critical + '%'
            ];
            const missing = expected.filter(v => !readme.includes(v));
            if (missing.length) throw new Error('README is out of date with data/benchmark.json, missing: ' + missing.join(', '));
            console.log('README figures match the benchmark');
          "
